<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EasyAdmin, in the browser</title>
    <meta name="description" content="The back office of a record shop that never existed, with EasyAdmin: a sales dashboard, filters, batch actions and fixtures loaded in your browser, without a server.">
    <meta property="og:image" content="https://lyrixx.github.io/php-wasm-builder/assets/social-image.png">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐘%3C/text%3E%3C/svg%3E">
    <style>
        /* Keep in sync with ../symfony-demo/index.html */
        :root {
            color-scheme: light dark;
            --accent: light-dark(#4f5b93, #a3acdc);
            --line: light-dark(#d9dbe4, #363948);
            --monospace: ui-monospace, Menlo, Consolas, monospace;
            --muted: light-dark(#5e6272, #9a9eb0);
            --surface: light-dark(#f4f5f9, #1c1e26);
            background: light-dark(#fff, #121318);
            color: light-dark(#1c1d23, #e2e3ea);
            font: 0.875rem/1.5 system-ui, sans-serif;
        }
        body {
            display: grid;
            grid-template-rows: auto 1fr;
            height: 100dvh;
            margin: 0;
        }
        header {
            display: flex;
            flex-wrap: wrap;
            gap: 0.25rem 1rem;
            align-items: center;
            padding: 0.5rem 1rem;
            border-bottom: 1px solid var(--line);
            background: var(--surface);
        }
        h1 {
            margin: 0;
            font-size: 1rem;
        }
        a {
            color: var(--accent);
            text-underline-offset: 0.15em;
        }
        #address {
            flex: 1;
            min-width: 8rem;
            overflow: hidden;
            color: var(--muted);
            font-family: var(--monospace);
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        button {
            padding: 0.2rem 0.6rem;
            border: 1px solid var(--line);
            border-radius: 0.375rem;
            background: transparent;
            color: inherit;
            font: inherit;
            cursor: pointer;
        }
        button:disabled {
            cursor: default;
            opacity: 0.5;
        }
        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }
        main {
            position: relative;
            min-height: 0;
        }
        iframe {
            display: block;
            box-sizing: border-box;
            width: 100%;
            height: 100%;
            border: none;
        }
        #message {
            position: absolute;
            inset: 0;
            display: grid;
            place-content: center;
            padding: 1rem;
            background: light-dark(#fff, #121318);
            color: var(--muted);
            font-size: 1rem;
            text-align: center;
        }
        #message:empty {
            display: none;
        }
    </style>
</head>
<body>
    <header>
        <h1><a href="../">Demos</a> / EasyAdmin</h1>
        <span id="address"></span>
        <button id="reset" type="button" disabled>Reset the data</button>
        <span>
            PHP runs in this tab, no server does.
            <a href="https://github.com/lyrixx/php-wasm-demo#readme">How?</a>
        </span>
    </header>
    <main>
        <iframe id="frame" title="The back office"></iframe>
        <p id="message">Downloading PHP and the application…</p>
    </main>

    <script type="module">
        import { createPhpInWorker, serveInFrame } from './build/php-web.mjs';

        const address = document.getElementById('address');
        const frame = document.getElementById('frame');
        const message = document.getElementById('message');
        const reset = document.getElementById('reset');

        try {
            await start();
        } catch (error) {
            // A browser that does not give the memory of the module, for example
            message.textContent = `The application does not start: ${error.message}`;
            throw error;
        }

        async function start() {
            // In a worker: the page, and the frame, do not freeze while PHP
            // runs. /easyadmin, where the database and the sessions are, is kept
            // in IndexedDB: keep in sync with ../../apps/easyadmin/.env
            const php = await createPhpInWorker({ persist: '/easyadmin' });

            const runConsole = async (...args) => {
                const { exitCode, stdout } = await php.runFile('/app/bin/console', { args: [...args, '--no-interaction'] });
                if (0 !== exitCode) {
                    throw new Error(`The console exits with ${exitCode}: ${stdout}`);
                }
            };

            // In the browser, not when the stack is built: the dates of the
            // sales are the ones of the visitor. The mark comes last: a tab
            // closed in the middle starts again on the next visit.
            const seed = async () => {
                await runConsole('doctrine:schema:update', '--force');
                await runConsole('doctrine:fixtures:load');
                await php.runCode(`touch('/easyadmin/seeded');`);
            };

            const { stdout } = await php.runCode(`echo (int) is_file('/easyadmin/seeded');`);
            if ('0' === stdout) {
                message.textContent = 'Loading the fixtures…';
                await seed();
            }

            reset.addEventListener('click', async () => {
                reset.disabled = true;
                await seed();
                frame.contentWindow.location.reload();
                reset.disabled = false;
            });

            const app = new URL('app', location.href).pathname;
            frame.addEventListener('load', () => {
                const { pathname, search } = frame.contentWindow.location;
                address.textContent = pathname.slice(app.length) + search;
                message.textContent = '';
            });

            message.textContent = 'Starting the application…';
            await serveInFrame(php, { frame, documentRoot: '/app/public', start: 'admin' });
            reset.disabled = false;
        }
    </script>
</body>
</html>
